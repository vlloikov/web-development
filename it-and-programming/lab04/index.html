<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор чаевых</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input,
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-left: 5px solid #ddd;
            background: #f9f9f9;
            border-radius: 4px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Калькулятор чаевых</h1>
    <!-- Поле для суммы счёта -->
    <label for="bill">Сумма счёта (₽):</label>
    <input type="number" id="bill" placeholder="Например, 1500">
    <!-- Выпадающий список с процентом -->
    <label for="tip">Процент чаевых:</label>
    <select id="tip">
        <option value="5">5%</option>
        <option value="10">10%</option>
        <option value="15" selected>15%</option>
        <option value="20">20%</option>
    </select>
    <!-- Кнопка -->
    <button id="calcBtn">Рассчитать</button>
    <!-- Блок для результата -->
    <div id="result">Введите сумму и нажмите «Рассчитать»</div>
</div>
<!-- Подключаем внешний JavaScript-файл -->
<script src="script.js"></script>
</body>
</html>
